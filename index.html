<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>삼진보이스 | 마산삼진고등학교 익명 소통 플랫폼</title>
  </head>
  <body>
    <!-- Netlify Forms static detection for SPA -->
    <form name="samjin-voice" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="samjin-voice" />
      <input type="text" name="title" />
      <input type="text" name="category" />
      <input type="text" name="authorNickname" />
      <textarea name="content"></textarea>
      <input type="text" name="tags" />
      <input type="checkbox" name="isSecret" />
      <input type="password" name="secretPin" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

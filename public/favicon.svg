<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF9F1" />
      <stop offset="60%" stop-color="#F4EEDC" />
      <stop offset="100%" stop-color="#E8DFCA" />
    </linearGradient>

    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ABC7A7" />
      <stop offset="50%" stop-color="#93B490" />
      <stop offset="100%" stop-color="#7B9E78" />
    </linearGradient>

    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F7155" />
      <stop offset="100%" stop-color="#3D5F45" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3A533E" flood-opacity="0.18" />
    </filter>

    <clipPath id="hexClip">
      <polygon points="200,112 276,156 276,244 200,288 124,244 124,156" />
    </clipPath>
  </defs>

  <!-- App Icon Background Squircle -->
  <rect width="400" height="400" rx="90" fill="url(#bgGrad)" />
  <rect width="392" height="392" x="4" y="4" rx="86" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6" />

  <!-- Diagonal warm background shading line -->
  <path d="M 0 400 L 400 0 L 400 400 Z" fill="#2D2926" opacity="0.025" />

  <!-- Left Audio Soundwaves -->
  <g fill="#4F7155">
    <circle cx="68" cy="200" r="3.5" />
    <rect x="76" y="190" width="4.5" height="20" rx="2.25" />
    <rect x="86" y="180" width="4.5" height="40" rx="2.25" />
    <rect x="96" y="170" width="4.5" height="60" rx="2.25" />
    <rect x="106" y="181" width="4.5" height="38" rx="2.25" />
  </g>

  <!-- Right Audio Soundwaves -->
  <g fill="#4F7155">
    <rect x="289.5" y="181" width="4.5" height="38" rx="2.25" />
    <rect x="299.5" y="170" width="4.5" height="60" rx="2.25" />
    <rect x="309.5" y="180" width="4.5" height="40" rx="2.25" />
    <rect x="319.5" y="190" width="4.5" height="20" rx="2.25" />
    <circle cx="332" cy="200" r="3.5" />
  </g>

  <!-- Center Hexagon Badge Outer Shadow & Fill -->
  <g filter="url(#softShadow)">
    <polygon points="200,112 276,156 276,244 200,288 124,244 124,156" 
             fill="url(#hexGrad)" 
             stroke="#537759" 
             stroke-width="5" 
             stroke-linejoin="round" />
  </g>

  <!-- Hexagon Inner White Border Line -->
  <polygon points="200,119 269,159 269,241 200,281 131,241 131,159" 
           fill="none" 
           stroke="#FFFFFF" 
           stroke-width="3" 
           stroke-linejoin="round" 
           opacity="0.85" />

  <!-- Inside Hexagon (Clipped) -->
  <g clip-path="url(#hexClip)">
    <!-- Glossy Diagonal Reflection -->
    <path d="M 120 120 L 290 120 L 290 220 L 120 300 Z" fill="#FFFFFF" opacity="0.14" />

    <!-- Microphone Capsule Body -->
    <rect x="181" y="178" width="38" height="52" rx="19" fill="url(#micGrad)" opacity="0.9" />

    <!-- Microphone Arc & Stand -->
    <path d="M 170 212 C 170 236, 230 236, 230 212" 
          fill="none" 
          stroke="#32523A" 
          stroke-width="6" 
          stroke-linecap="round" />
    
    <path d="M 200 234 L 200 264 M 188 264 L 212 264" 
          fill="none" 
          stroke="#32523A" 
          stroke-width="5.5" 
          stroke-linecap="round" />
  </g>

  <!-- School Emblem '高' + '三' Voice lines on Left & Right -->
  <g fill="#32523A">
    <!-- Left 3 Horizontal Bars '三' -->
    <rect x="155" y="156" width="20" height="4.5" rx="2.25" />
    <rect x="155" y="169" width="20" height="4.5" rx="2.25" />
    <rect x="155" y="182" width="20" height="4.5" rx="2.25" />

    <!-- Center '高' School Character -->
    <!-- Top dot/bar -->
    <rect x="195.5" y="148" width="9" height="6" rx="1.5" />
    <rect x="180" y="156" width="40" height="4.5" rx="1.5" />
    
    <!-- Upper Box '口' -->
    <path d="M 185 163.5 L 215 163.5 L 215 176 L 185 176 Z M 190 167.5 L 190 172 L 210 172 L 210 167.5 Z" fill-rule="evenodd" />

    <!-- Lower Frame '冂' & Inner Triangle '△' -->
    <path d="M 180.5 178 L 219.5 178 L 219.5 197 L 214.5 197 L 214.5 183 L 185.5 183 L 185.5 197 L 180.5 197 Z" />
    <polygon points="200,183 192.5,195 207.5,195" fill="none" stroke="#32523A" stroke-width="3" stroke-linejoin="round" />

    <!-- Right 3 Horizontal Bars '三' -->
    <rect x="225" y="156" width="20" height="4.5" rx="2.25" />
    <rect x="225" y="169" width="20" height="4.5" rx="2.25" />
    <rect x="225" y="182" width="20" height="4.5" rx="2.25" />
  </g>
</svg>
